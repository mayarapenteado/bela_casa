<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar | Bela Casa Presentes</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="pagina-login">
  <main class="caixa-login">
    <h1>Bela Casa <small>Presentes</small></h1>
    <p>Entre para gerenciar clientes e pedidos.</p>

    {% with mensagens = get_flashed_messages(with_categories=true) %}
      {% for categoria, texto in mensagens %}
        <div class="aviso aviso-{{ categoria }}" role="alert">{{ texto }}</div>
      {% endfor %}
    {% endwith %}

    <form method="post">
      <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
      <div class="campo">
        <label for="login">Usuário</label>
        <input id="login" name="login" autocomplete="username" required autofocus>
      </div>
      <div class="campo">
        <label for="senha">Senha</label>
        <input id="senha" name="senha" type="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn">Entrar</button>
    </form>
  </main>
</body>
</html>
